version: '3.8'

services:


  # ----------------------------
  # PRIMARY KAFKA (KRaft)
  # ----------------------------
  primary-kafka:
    image: apache/kafka:4.0.0
    container_name: primary-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://primary-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@primary-kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ----------------------------
  # STANDBY KAFKA (KRaft)
  # ----------------------------
  standby-kafka:
    image: apache/kafka:4.0.0
    container_name: standby-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://standby-kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 2@standby-kafka:9095
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ----------------------------
  # MIRRORMAKER 2 (CUSTOM IMAGE)
  # ----------------------------
  mm2:
    image: kafka-mirror-maker:latest  # if you have built the image already
    container_name: mm2
    depends_on:
      - primary-kafka
      - standby-kafka
    volumes:
      - ./config/mm2.properties:/kafka/config/mm2.properties
    command: ["bin/connect-mirror-maker.sh", "/kafka/config/mm2.properties"]
    # command: ["sh", "-c", "until nc -z primary-kafka 9092; do sleep 1; done; /kafka/config/mm2.properties"]
  # ----------------------------
  # PRODUCER (CUSTOM IMAGE)
  # ----------------------------
  producer:
    image: producer:latest
    container_name: producer
    depends_on:
      - primary-kafka
    environment:
      BOOTSTRAP_SERVERS: primary-kafka:9092
    command: ["java", "-jar", "/app/app.jar"]